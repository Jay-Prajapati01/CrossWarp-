[package]
name = "unified-workspace-agent"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
cap-std = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
hex = "0.4"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
uuid = { version = "1", features = ["serde", "v4"] }
zeroize = "1"

