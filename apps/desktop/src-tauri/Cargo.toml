[package]
name = "unified-workspace-desktop"
version = "0.1.0"
description = "Unified Cross-PC Workspace desktop control panel"
authors = ["Unified Workspace"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }
unified-workspace-agent = { path = "../../../crates/agent" }

[workspace]
